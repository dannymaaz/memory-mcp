name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff==0.15.12
      - name: Verify package metadata
        run: |
          python -c "import sys; assert sys.version_info >= (3, 11)"
          python -c "from importlib.metadata import requires; assert requires('persistent-memory-mcp') is not None"
      - name: Compile
        run: python -m compileall persistent_memory_mcp src
      - name: Lint
        run: ruff check persistent_memory_mcp src tests scripts
      - name: Tests
        run: pytest -q
      - name: Agent evaluation regressions
        run: python -m persistent_memory_mcp.evaluation_regression

  release-artifacts:
    name: Release artifacts · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata
        run: python -c "from pathlib import Path; import subprocess, sys; files=[str(p) for p in Path('dist').iterdir()]; subprocess.check_call([sys.executable, '-m', 'twine', 'check', *files])"
      - name: Validate clean wheel installation
        run: python scripts/validate_release_artifact.py dist
      - name: Validate installed v0.2.0 upgrade path
        run: python scripts/validate_v020_upgrade.py dist .

  dependency-audit:
    name: Dependency audit · core and remote extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling and optional remote dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[remote]"
          pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --skip-editable
