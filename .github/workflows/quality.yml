name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff==0.15.12
      - name: Verify package metadata
        run: |
          python -c "import sys; assert sys.version_info >= (3, 11)"
          python -c "from importlib.metadata import requires, version; assert version('persistent-memory-mcp') == '0.3.0'; assert requires('persistent-memory-mcp') is not None"
      - name: Compile
        run: python -m compileall persistent_memory_mcp src
      - name: Lint
        run: ruff check persistent_memory_mcp src tests scripts
      - name: Tests
        run: pytest -q
      - name: Agent evaluation regressions
        run: python -m persistent_memory_mcp.evaluation_regression

  token-accounting:
    name: Reference token accounting · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional tokenizer reference
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tokenizers]"
          pip install pytest
      - name: Report deterministic estimator error
        run: python scripts/evaluate_tokenization.py
      - name: Validate Context Packet and tokenizer fixtures
        run: pytest -q tests/test_tokenization.py tests/test_context_packet.py tests/test_context_packet_routing.py
      - name: Report progressive repository retrieval metrics
        run: python scripts/evaluate_repository_retrieval.py
      - name: Report persistent symbol evolution metrics
        run: python scripts/evaluate_symbol_evolution.py
      - name: Enforce Context Compiler quality thresholds
        run: python scripts/evaluate_context_quality.py
      - name: Enforce adversarial provenance guardrails
        run: python scripts/evaluate_context_adversarial.py
      - name: Enforce operational map bounds and latency
        run: python scripts/evaluate_operational_map.py

  release-artifacts:
    name: Release artifacts · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata
        run: python -c "from pathlib import Path; import subprocess, sys; files=[str(p) for p in Path('dist').iterdir()]; subprocess.check_call([sys.executable, '-m', 'twine', 'check', *files])"
      - name: Validate release version
        run: python scripts/validate_release_version.py dist
      - name: Generate and verify SHA-256 checksums
        run: |
          python scripts/generate_checksums.py dist
          python scripts/generate_checksums.py dist --verify
      - name: Validate clean wheel installation
        run: python scripts/validate_release_artifact.py dist
      - name: Validate installed v0.2.0 upgrade path
        run: python scripts/validate_v020_upgrade.py dist .

  dependency-audit:
    name: Dependency audit · core and optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling and optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[remote,tokenizers]"
          pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --skip-editable
