name: Restore diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  restore-case:
    name: macOS restore · ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: success
            node: tests/test_restore_service.py::test_restore_preview_is_non_mutating_and_execution_restores_verified_backup
          - name: single-use
            node: tests/test_restore_service.py::test_restore_confirmation_is_single_use
          - name: tampered-backup
            node: tests/test_restore_service.py::test_tampered_backup_after_preview_is_rejected_without_touching_active_database
          - name: active-drift
            node: tests/test_restore_service.py::test_active_database_change_after_preview_is_rejected
          - name: schema-mismatch
            node: tests/test_restore_service.py::test_schema_mismatch_is_rejected_during_preview
          - name: disk-space
            node: tests/test_restore_service.py::test_insufficient_disk_space_blocks_preview
          - name: expiry
            node: tests/test_restore_service.py::test_expired_confirmation_is_rejected
          - name: changed-plan
            node: tests/test_restore_service.py::test_modified_plan_does_not_validate_original_token
          - name: rollback
            node: tests/test_restore_service.py::test_post_replace_failure_automatically_rolls_back_to_pre_restore_state
          - name: same-source
            node: tests/test_restore_service.py::test_restore_source_cannot_be_the_active_database
          - name: integration
            node: tests/test_restore_integration.py::test_verified_restore_tools_register_idempotently
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Run isolated restore case
        run: python -m pytest -q "${{ matrix.node }}"
