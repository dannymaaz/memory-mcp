name: Publish GitHub Release v0.3.0

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE-v0.3.0 to create the immutable v0.3.0 tag and GitHub Release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-github-v0.3.0
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish immutable GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.3.0
      EXPECTED_COMMIT: 9e0a084dd9b179612082edef99e1c3c9bf563ffa
      RELEASE_TITLE: Persistent Memory MCP v0.3.0 — Data Safety and Recovery
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require explicit release confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RELEASE-v0.3.0"

      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          ref: 9e0a084dd9b179612082edef99e1c3c9bf563ffa
          fetch-depth: 0

      - name: Verify immutable source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          assert data["project"]["version"] == "0.3.0"
          dependencies = set(data["project"].get("dependencies", []))
          assert "mcp>=1.28,<2" in dependencies, dependencies
          server = pathlib.Path("persistent_memory_mcp/server.py")
          if not server.exists():
              server = pathlib.Path("src/server.py")
          assert server.exists(), "Expected server module is missing"
          assert "FastMCP" in server.read_text(encoding="utf-8")
          PY

      - name: Refuse an existing GitHub Release and validate any existing tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release for $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$EXPECTED_COMMIT"
            echo "TAG_ALREADY_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_ALREADY_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist from immutable source
        run: python -m build

      - name: Validate package metadata and release version
        run: |
          python -m twine check dist/*
          python scripts/validate_release_version.py dist

      - name: Generate and verify SHA-256 checksums
        run: |
          python scripts/generate_checksums.py dist
          python scripts/generate_checksums.py dist --verify

      - name: Validate clean installed wheel
        run: python scripts/validate_release_artifact.py dist

      - name: Revalidate installed v0.2.0 upgrade
        run: python scripts/validate_v020_upgrade.py dist .

      - name: Extract canonical release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start = text.index("## 0.3.0")
          end = text.find("\n## 0.2.0", start)
          if end == -1:
              end = len(text)
          Path("release-notes.md").write_text(text[start:end].strip() + "\n", encoding="utf-8")
          PY

      - name: Retain validated release bundle in Actions
        uses: actions/upload-artifact@v7
        with:
          name: persistent-memory-mcp-v0.3.0-github-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Create annotated immutable tag when absent
        if: env.TAG_ALREADY_EXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$EXPECTED_COMMIT" -m "$RELEASE_TITLE"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Verify remote tag type and target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$EXPECTED_COMMIT"

      - name: Create draft GitHub Release with exact validated assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md

      - name: Re-download and verify draft release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 3

          mkdir -p release-verify
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --pattern 'SHA256SUMS' \
            --dir release-verify

          python scripts/generate_checksums.py release-verify --verify
          python scripts/validate_release_version.py release-verify
          python -m twine check release-verify/*.whl release-verify/*.tar.gz
          cmp dist/SHA256SUMS release-verify/SHA256SUMS

      - name: Publish final GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --prerelease=false \
            --latest

      - name: Verify final release state
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 3
          {
            echo "## GitHub Release published"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$EXPECTED_COMMIT\`"
            echo "- Release: $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          } >> "$GITHUB_STEP_SUMMARY"
