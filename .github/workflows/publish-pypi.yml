name: Publish v0.3.0 to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Validated GitHub Release tag to publish"
        required: true
        default: "v0.3.0"
        type: string
  push:
    branches:
      - "release/publish-pypi-v0.3.0"

permissions:
  contents: read

concurrency:
  group: publish-pypi-v0.3.0
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify exact GitHub Release bundle
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.3.0
      EXPECTED_TAG: v0.3.0
      EXPECTED_COMMIT: 9e0a084dd9b179612082edef99e1c3c9bf563ffa
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an authorized v0.3.0 publication trigger
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$REQUESTED_TAG" = "$EXPECTED_TAG"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$GITHUB_REF" = "refs/heads/release/publish-pypi-v0.3.0"
          fi

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == "v0.3.0" and .isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -Fx "$EXPECTED_TAG"

      - name: Checkout the exact release tag
        uses: actions/checkout@v7
        with:
          ref: v0.3.0
          fetch-depth: 0

      - name: Require the validated release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification tooling
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download exact GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --pattern 'SHA256SUMS' \
            --dir dist

      - name: Verify checksums and package metadata
        run: |
          python scripts/generate_checksums.py dist --verify
          python scripts/validate_release_version.py dist
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Stage verified distributions for publishing
        uses: actions/upload-artifact@v7
        with:
          name: verified-pypi-v0.3.0
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/persistent-memory-mcp
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@v8
        with:
          name: verified-pypi-v0.3.0
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
