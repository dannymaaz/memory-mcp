name: Dashboard maintenance diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-probe:
    name: Status probe · ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [health, verification, sensitivity, paths]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run probe
        run: python scripts/dashboard_status_probe.py ${{ matrix.check }}

  status-remaining:
    name: Remaining status tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Run remaining status tests
        run: >-
          pytest -q
          tests/test_dashboard_status.py::test_status_detects_latest_verified_backup_without_exposing_paths
          tests/test_dashboard_status.py::test_status_is_owner_scoped
          tests/test_dashboard_status.py::test_status_fails_closed_when_owner_is_ambiguous

  http-ui:
    name: Dashboard HTTP and UX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Run HTTP and UX tests
        run: pytest -q tests/test_dashboard_maintenance_http.py

  actions:
    name: Dashboard maintenance actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Run action tests
        run: pytest -q tests/test_dashboard_actions.py
