name: Dashboard maintenance diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-dashboard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Dashboard status tests
        run: pytest -q tests/test_dashboard_status.py
      - name: Dashboard HTTP and UX tests
        run: pytest -q tests/test_dashboard_maintenance_http.py
      - name: Dashboard maintenance action tests
        run: pytest -q tests/test_dashboard_actions.py
